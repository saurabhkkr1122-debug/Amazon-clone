<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout</title>

<link rel="stylesheet" href="css/style.css">

<style>

.checkout-container{
max-width:1200px;
margin:30px auto;
display:grid;
grid-template-columns:2fr 1fr;
gap:30px;
padding:20px;
}

.checkout-form,
.order-summary{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.form-group{
margin-bottom:15px;
}

.form-group label{
display:block;
margin-bottom:5px;
font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:5px;
}

.order-item{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.total{
font-size:22px;
font-weight:bold;
margin-top:20px;
color:#e63946;
}

.place-order{
background:#ff9900;
color:white;
border:none;
padding:15px;
width:100%;
margin-top:20px;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

@media(max-width:768px){

.checkout-container{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>

<div class="logo">
ShopHub
</div>

</header>

<div class="checkout-container">

<div class="checkout-form">

<h2>Shipping Address</h2>

<form id="checkoutForm">

<div class="form-group">
<label>Full Name</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" required>
</div>

<div class="form-group">
<label>Phone Number</label>
<input type="tel" required>
</div>

<div class="form-group">
<label>Address</label>
<textarea rows="4" required></textarea>
</div>

<div class="form-group">
<label>City</label>
<input type="text" required>
</div>

<div class="form-group">
<label>Pincode</label>
<input type="text" required>
</div>

<h2>Payment Method</h2>

<div class="form-group">
<select required>

<option value="">
Select Payment Method
</option>

<option>
Cash On Delivery
</option>

<option>
UPI
</option>

<option>
Credit Card
</option>

<option>
Debit Card
</option>

<option>
Net Banking
</option>

</select>
</div>

<button
type="submit"
class="place-order">

Place Order

</button>

</form>

</div>

<div class="order-summary">

<h2>Order Summary</h2>

<div id="summaryItems"></div>

<div class="total"
id="totalPrice">

₹0

</div>

</div>

</div>

<script src="js/products.js"></script>

<script>

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const summary =
document.getElementById(
"summaryItems"
);

let total = 0;

cart.forEach(id=>{

const product =
products.find(
p=>p.id===id
);

if(product){

total += product.price;

summary.innerHTML += `

<div class="order-item">

<span>
${product.name}
</span>

<span>
₹${product.price}
</span>

</div>

`;

}

});

document.getElementById(
"totalPrice"
).innerText =
"Total: ₹" + total;

document
.getElementById("checkoutForm")
.addEventListener("submit",e=>{

e.preventDefault();

localStorage.removeItem("cart");

window.location.href =
"order-success.html";

});

</script>

</body>
</html>

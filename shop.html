<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/shop.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<header>

<div class="logo">
ShopHub
</div>

<div class="search-box">

<input
type="text"
id="searchBox"
placeholder="Search products">

</div>

<div class="nav-icons">

<a href="wishlist.html">
❤️
<span id="wishlistCount">0</span>
</a>

<a href="cart.html">
🛒
<span id="cartCount">0</span>
</a>

</div>

</header>

<div class="shop-container">

<aside class="filters">

<h2>Filters</h2>

<label>Price</label>

<select id="priceFilter">

<option value="all">
All
</option>

<option value="1000">
Below ₹1000
</option>

<option value="3000">
Below ₹3000
</option>

<option value="5000">
Below ₹5000
</option>

</select>

<label>Rating</label>

<select id="ratingFilter">

<option value="all">
All
</option>

<option value="4">
4+ Stars
</option>

<option value="4.5">
4.5+ Stars
</option>

</select>

<label>Sort</label>

<select id="sortProducts">

<option value="default">
Default
</option>

<option value="low">
Price Low → High
</option>

<option value="high">
Price High → Low
</option>

<option value="rating">
Top Rated
</option>

</select>

</aside>

<main>

<div id="shopProducts"
class="product-grid">

</div>

</main>

</div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/shop.js"></script>

</body>
</html>
